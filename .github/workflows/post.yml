name: Instagram自動投稿

on:
  schedule:
    # UTC 0:00 = 日本時間 9:00。時刻を変えたい場合はここを編集
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行するためのボタン

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Instagramへ投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_instagram.py

      - name: 投稿済みフォルダの移動をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts posts_done
          git diff --cached --quiet || git commit -m "chore: 投稿済み分をposts_doneへ移動"
          git push
